# Nome apresentado pelo Spring durante a inicialização.
spring.application.name=academia-alunos-web

# Banco H2 em memória: os dados existem somente enquanto a aplicação está aberta.
spring.datasource.url=jdbc:h2:mem:academiadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria o esquema ao iniciar e o descarta ao encerrar.
spring.jpa.hibernate.ddl-auto=create-drop

# SQL visível e formatado favorece a observação didática durante a aula.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console administrativo do H2 solicitado no briefing.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mantém mensagens de erro internas fora das respostas padrão do Spring.
server.error.include-message=never
server.error.include-stacktrace=never
